<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Recipes</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #09090b;
      color: #fafafa;
      text-align: center;
    }
    h1 { margin-bottom: 0.5rem; }
    p { color: #a1a1aa; max-width: 400px; line-height: 1.5; }
    a {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background-color: #fafafa;
      color: #09090b;
      text-decoration: none;
      border-radius: 0.5rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10.7 17H6M8.7 13H6M15 21v-4c0-1.5-1-2.8-2.4-3.2"/>
    <path d="M2.5 8.5c1.4-1.2 3.1-2 5-2.2M17.5 8.5c1.4-1.2 3.1-2 5-2.2"/>
    <path d="m2 2 20 20"/>
  </svg>
  <h1>You are offline</h1>
  <p>Please check your internet connection. You can still access your favorited recipes offline if you navigate to the Favorites page.</p>
  <a href="/favorites">Go to Favorites</a>
  <script>
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
